server:
  port: 8081

spring:
  application:
    name: auth-service
  config:
    import: classpath:application-common.yml

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:newsplatform}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme_db_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: "${JWT_SECRET:changeme_jwt_secret_min_32_chars_long}"
  expiration-ms: 900000 # 15 minutes (900 seconds)
  refresh-expiration-ms: 604800000 # 7 days (604,800 seconds)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
