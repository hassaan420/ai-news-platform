spring:
  application:
    name: news-service
  config:
    import: classpath:application-common.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/news_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:newsplatform}
    password: ${SPRING_DATASOURCE_PASSWORD:newsplatform123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
  data.web.pageable.max-page-size: 100

# AI provider configuration.
# Set GOOGLE_API_KEY (env) to enable Gemini. While unset, AiService falls back
# to its built-in heuristic provider automatically — no outage required.
ai:
  gemini:
    api-key: ${GOOGLE_API_KEY:}
    model: gemini-flash-latest

server:
  port: 8082
