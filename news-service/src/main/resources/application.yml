spring:
  application:
    name: news-service
  config:
    import: classpath:application-common.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/news_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:newsplatform}
    password: ${SPRING_DATASOURCE_PASSWORD:newsplatform123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
  data.web.pageable.max-page-size: 100

server:
  port: 8082

# ─── AI Provider Configuration ──────────────────────────────────────────────
# Set GOOGLE_API_KEY (env) to enable Gemini. While unset, AiService falls back
# to its built-in heuristic provider automatically — no outage required.
ai:
  gemini:
    api-key: ${GOOGLE_API_KEY:}
    model: ${AI_GEMINI_MODEL:gemini-flash-latest}

  # Number of AI worker threads.
  # IMPORTANT: Keep this small (2-4) to avoid exceeding Gemini's free-tier quota.
  # Each worker makes at most 1 Gemini call per article (combined prompt).
  # Override via AI_PROCESSING_WORKER_COUNT environment variable.
  processing:
    worker-count: ${AI_PROCESSING_WORKER_COUNT:2}

# ─── Gemini Rate Limiter ─────────────────────────────────────────────────────
# All Gemini requests flow through a centralized rate limiter. These settings
# are the primary protection against quota exhaustion.
gemini:
  rate-limit:
    # Master switch. Set to false to disable rate limiting (not recommended in production).
    enabled: ${GEMINI_RATE_LIMIT_ENABLED:true}

    # Minimum milliseconds between any two Gemini API calls (across all threads).
    # Default 6000ms = max ~10 calls/minute, well within the 20 req/min free-tier limit.
    min-interval-ms: ${GEMINI_MIN_INTERVAL_MS:6000}

    # Seconds to block all Gemini calls after receiving HTTP 429 (circuit breaker cooldown).
    # The provider's retryDelay is used instead when safely parseable from the 429 response.
    cooldown-seconds: ${GEMINI_COOLDOWN_SECONDS:60}

    # Maximum cooldown duration regardless of what the provider says.
    # Prevents malformed responses from causing infinite blocking.
    max-cooldown-seconds: ${GEMINI_MAX_COOLDOWN_SECONDS:300}

  retry:
    # Number of attempts for transient failures (5xx, network errors).
    # HTTP 429 is NEVER retried through this mechanism — it triggers the cooldown instead.
    max-attempts: ${GEMINI_RETRY_MAX_ATTEMPTS:2}

    # Initial backoff between retry attempts for transient errors.
    initial-backoff-ms: ${GEMINI_RETRY_INITIAL_BACKOFF_MS:1000}

    # Maximum backoff between retry attempts (exponential cap).
    max-backoff-ms: ${GEMINI_RETRY_MAX_BACKOFF_MS:10000}
