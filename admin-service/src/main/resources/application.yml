spring:
  application:
    name: admin-service
  config:
    import: classpath:application-common.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/admin_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:newsplatform}
    password: ${SPRING_DATASOURCE_PASSWORD:newsplatform123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8086
