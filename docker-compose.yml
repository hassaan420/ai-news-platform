# docker-compose.yml — base service definitions
# Environment-agnostic; secrets supplied via .env file.
# Dev overrides: docker-compose.override.yml (auto-loaded)
# Prod overrides: docker-compose.prod.yml (explicit -f flag)
# See DOCKER.md §3–§8

networks:
  news-platform-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:

services:

  # ─── Infrastructure ─────────────────────────────────────────

  mysql:
    image: mysql:8.0
    container_name: news-platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: auth_db
      MYSQL_USER: ${MYSQL_USER:-newsplatform}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Ports exposed only in docker-compose.override.yml (dev)
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - news-platform-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: news-platform-redis
    restart: unless-stopped
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}" ]
    # Ports exposed only in docker-compose.override.yml (dev)
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - news-platform-net
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: news-platform-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - news-platform-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Application Services ──────────────────────────────────

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: news-platform-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_OPTS: ${JAVA_OPTS:-}
    networks:
      - news-platform-net
    depends_on:
      auth-service:
        condition: service_healthy
      news-service:
        condition: service_healthy
      category-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      scheduler-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://gateway-service:8080/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: news-platform-auth
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-newsplatform}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JAVA_OPTS: ${JAVA_OPTS:-}
    networks:
      - news-platform-net
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://auth-service:8081/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  news-service:
    build:
      context: .
      dockerfile: news-service/Dockerfile
    container_name: news-platform-news
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/news_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-newsplatform}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      JAVA_OPTS: ${JAVA_OPTS:-}
      # ── AI worker concurrency (keep small to protect Gemini free-tier quota) ──
      AI_PROCESSING_WORKER_COUNT: ${AI_PROCESSING_WORKER_COUNT:-2}
      # ── Gemini rate limiting ──────────────────────────────────────────────────
      GEMINI_RATE_LIMIT_ENABLED: ${GEMINI_RATE_LIMIT_ENABLED:-true}
      GEMINI_MIN_INTERVAL_MS: ${GEMINI_MIN_INTERVAL_MS:-6000}
      GEMINI_COOLDOWN_SECONDS: ${GEMINI_COOLDOWN_SECONDS:-60}
      GEMINI_MAX_COOLDOWN_SECONDS: ${GEMINI_MAX_COOLDOWN_SECONDS:-300}
      # ── Gemini retry (transient errors only, NOT 429) ─────────────────────────
      GEMINI_RETRY_MAX_ATTEMPTS: ${GEMINI_RETRY_MAX_ATTEMPTS:-2}
      GEMINI_RETRY_INITIAL_BACKOFF_MS: ${GEMINI_RETRY_INITIAL_BACKOFF_MS:-1000}
      GEMINI_RETRY_MAX_BACKOFF_MS: ${GEMINI_RETRY_MAX_BACKOFF_MS:-10000}
    networks:
      - news-platform-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://news-service:8082/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  category-service:
    build:
      context: .
      dockerfile: category-service/Dockerfile
    container_name: news-platform-category
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/category_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-newsplatform}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JAVA_OPTS: ${JAVA_OPTS:-}
    networks:
      - news-platform-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://category-service:8083/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  search-service:
    build:
      context: .
      dockerfile: search-service/Dockerfile
    container_name: news-platform-search
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      NEWS_SERVICE_BASE_URL: http://news-service:8082
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JAVA_OPTS: ${JAVA_OPTS:-}
    networks:
      - news-platform-net
    depends_on:
      news-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://search-service:8084/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  scheduler-service:
    build:
      context: .
      dockerfile: scheduler-service/Dockerfile
    container_name: news-platform-scheduler
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/news_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-newsplatform}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      NEWS_SERVICE_BASE_URL: http://news-service:8082
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      NEWSAPI_KEY: ${NEWSAPI_KEY}
      GNEWS_KEY: ${GNEWS_KEY}
      MEDIASTACK_KEY: ${MEDIASTACK_KEY}
      GUARDIAN_KEY: ${GUARDIAN_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: ${JAVA_OPTS:-}
    networks:
      - news-platform-net
    depends_on:
      news-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://scheduler-service:8085/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    container_name: news-platform-admin
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/admin_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-newsplatform}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      NEWS_SERVICE_BASE_URL: http://news-service:8082
      CATEGORY_SERVICE_BASE_URL: http://category-service:8083
      SCHEDULER_SERVICE_BASE_URL: http://scheduler-service:8085
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JAVA_OPTS: ${JAVA_OPTS:-}
    networks:
      - news-platform-net
    depends_on:
      auth-service:
        condition: service_healthy
      news-service:
        condition: service_healthy
      category-service:
        condition: service_healthy
      scheduler-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://admin-service:8086/actuator/health" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: news-platform-frontend
    restart: unless-stopped
    networks:
      - news-platform-net
    depends_on:
      gateway-service:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Reverse Proxy ─────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: news-platform-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - news-platform-net
    depends_on:
      gateway-service:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
