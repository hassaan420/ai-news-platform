spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      # Base routing — no auth/JWT verification in Phase 1 setup
      # JWT verification filter will be added in Phase 2
      routes:
        # Auth Service
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        # News Service — public endpoints
        - id: news-service
          uri: http://news-service:8082
          predicates:
            - Path=/api/news/**, /api/articles/**
          filters:
            - StripPrefix=0

        # Category Service
        - id: category-service
          uri: http://category-service:8083
          predicates:
            - Path=/api/categories/**
          filters:
            - StripPrefix=0

        # Search Service
        - id: search-service
          uri: http://search-service:8084
          predicates:
            - Path=/api/news/search/**
          filters:
            - StripPrefix=0

        # Admin Service
        - id: admin-service
          uri: http://admin-service:8086
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=0

        # Scheduler Service (admin-triggered only)
        - id: scheduler-service
          uri: http://scheduler-service:8085
          predicates:
            - Path=/api/scheduler/**
          filters:
            - StripPrefix=0

      # Default filters applied to all routes
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      # Internal endpoints are NOT routed through the gateway (SECURITY.md §3)
      # No route with /internal/** prefix exists

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
