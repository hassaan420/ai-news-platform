spring:
  application:
    name: gateway-service
  config:
    import: classpath:application-common.yml

  cloud:
    gateway:
      # Route table mapping public endpoints to downstream services
      # Routes are evaluated in order of definition (search must precede news to catch /api/news/search)
      routes:
        # 1. Search Service (higher precedence than general news route)
        - id: search-service
          uri: ${SEARCH_SERVICE_URL:http://search-service:8084}
          predicates:
            - Path=/api/news/search/**
          filters:
            - StripPrefix=0

        # 2. News Service (handles /api/news/** and /api/articles/**)
        - id: news-service
          uri: ${NEWS_SERVICE_URL:http://news-service:8082}
          predicates:
            - Path=/api/news/**
          filters:
            - StripPrefix=0

        # 3. Auth Service
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        # 4. Category Service
        - id: category-service
          uri: ${CATEGORY_SERVICE_URL:http://category-service:8083}
          predicates:
            - Path=/api/categories/**,/api/weather/**
          filters:
            - StripPrefix=0

        # 5. Admin Service
        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://admin-service:8086}
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=0

        # 6. Scheduler Service (admin trigger route)
        - id: scheduler-service
          uri: ${SCHEDULER_SERVICE_URL:http://scheduler-service:8085}
          predicates:
            - Path=/api/scheduler/**
          filters:
            - StripPrefix=0

      # Global CORS configuration (Hardened for Production)
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "https://*.newsplatform.com"
              - "http://localhost:3000"
              - "http://localhost"
              - "http://localhost:5173"
              - "http://localhost:5555"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            exposedHeaders:
              - Authorization
              - X-Correlation-Id
            maxAge: 3600

server:
  port: 8080

