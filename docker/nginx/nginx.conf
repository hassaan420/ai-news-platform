# Nginx Production-Hardened Configuration
# Implements: OWASP A05, HSTS, Strict CSP, Rate Limiting, DDoS Protection

# ─── Global: Hide server version ──────────────────────────────
# (Set in nginx.conf main block: server_tokens off;)

# ─── Rate Limiting Zones ──────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=global:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# ─── Upstream: gateway (application) ─────────────────────────
upstream gateway {
    server gateway-service:8080;
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 100;
}

# ─── Upstream: frontend (React SPA) ──────────────────────────
upstream frontend {
    server frontend:80;
    keepalive 16;
}

# ─── HTTP Server ──────────────────────────────────────────────
server {
    listen 80;
    server_name localhost _;

    # ── Security Headers ─────────────────────────────────────
    server_tokens off;

    # HSTS — Only on HTTPS (preload-ready, 1-year max-age)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Strict Content Security Policy (nonce-based for inline scripts)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss:; media-src 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

    # Clickjacking protection
    add_header X-Frame-Options "DENY" always;

    # MIME-type sniffing protection
    add_header X-Content-Type-Options "nosniff" always;

    # XSS (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy — strict
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy — disable unnecessary browser features
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Cross-Origin policies
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # add_header Cross-Origin-Embedder-Policy "require-corp" always;
    # add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ── Connection Limits (DDoS Protection) ─────────────────
    limit_conn addr 20;
    limit_req zone=global burst=50 nodelay;
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 10s;
    send_timeout 30s;

    # ── Gzip Compression ────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/xml
        application/manifest+json
        text/css
        text/javascript
        text/plain
        text/xml;

    # ── API Proxy (Rate Limited) ─────────────────────────────
    location /api/ {
        # Auth endpoints — strict rate limit
        limit_req zone=api burst=30 nodelay;

        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ── Auth Endpoints — Stricter Rate Limiting ──────────────
    location ~ ^/api/(auth/login|auth/register|auth/refresh) {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health check endpoint ────────────────────────────────
    location /health {
        access_log off;
        return 200 '{"status":"UP"}';
        add_header Content-Type application/json;
    }

    # ── Frontend SPA ─────────────────────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    # ── Block Hidden Files (e.g., .git, .env) ───────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Block Actuator endpoints from external access ────────
    location ~ ^/(api/)?actuator(/.*)?$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # ── Block Common Exploit Paths ───────────────────────────
    location ~* (\.php|\.asp|\.aspx|\.jsp|cgi-bin|wp-admin|phpmyadmin) {
        deny all;
        return 404;
    }

    # ── Error Pages ──────────────────────────────────────────
    error_page 400 401 403 404 /40x.html;
    error_page 502 503 504 /50x.html;
    location = /40x.html { root /usr/share/nginx/html; internal; }
    location = /50x.html { root /usr/share/nginx/html; internal; }

    # ── Access Logging (Structured JSON) ────────────────────
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;
}
