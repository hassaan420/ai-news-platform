groups:
- name: spring_boot_alerts
  rules:
  
  # High CPU Alert
  - alert: HighCPUUsage
    expr: system_cpu_usage > 0.8
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "High CPU usage on {{ $labels.instance }}"
      description: "CPU usage is > 80% (current value: {{ $value }})"

  # High Memory Alert
  - alert: HighMemoryUsage
    expr: jvm_memory_used_bytes / jvm_memory_max_bytes > 0.85
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "High Memory usage on {{ $labels.instance }}"
      description: "JVM Heap usage is > 85% (current value: {{ $value }})"

  # 5xx Errors Alert
  - alert: HighErrorRate
    expr: rate(http_server_requests_seconds_count{status=~"5.."}[1m]) > 0.05
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "High 5xx error rate on {{ $labels.instance }}"
      description: "Error rate is > 5% over 1m"

  # Container/Instance Down
  - alert: InstanceDown
    expr: up == 0
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "Instance {{ $labels.instance }} down"
      description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 30 seconds."
