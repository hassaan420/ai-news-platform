global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'alertmanager:9093'

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: 'spring-boot-services'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: 
        - 'gateway-service:8080'
        - 'auth-service:8081'
        - 'news-service:8082'
        - 'category-service:8083'
        - 'search-service:8084'
        - 'scheduler-service:8085'
        - 'admin-service:8086'
