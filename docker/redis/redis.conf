# Redis configuration for AI News Platform
# See CACHE_STRATEGY.md §1 and DECISIONS.md A-21

# Require password authentication
requirepass ${REDIS_PASSWORD}

# Persistence — AOF enabled for durability of rate-limit/lock state
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Network
bind 0.0.0.0
protected-mode no
port 6379

# Logging
loglevel notice
