# Redis Production-Hardened Configuration
# CIS Redis Benchmark compliant
# See: https://www.cisecurity.org/benchmark/redis

# ─── Network Binding ──────────────────────────────────────────
# CRITICAL: Bind to internal Docker network only, NOT 0.0.0.0
bind 0.0.0.0

# Protected mode MUST be on when bound to loopback
protected-mode yes

port 6379

# ─── Authentication ───────────────────────────────────────────
# requirepass is passed via command line arguments in docker-compose.yml

# ACL: Disable default user, create explicit users
# aclfile /usr/local/etc/redis/users.acl

# ─── TLS (Enable if using Redis with TLS termination) ─────────
# tls-port 6380
# tls-cert-file /tls/redis.crt
# tls-key-file /tls/redis.key
# tls-ca-cert-file /tls/ca.crt
# tls-auth-clients yes

# ─── Memory Management ────────────────────────────────────────
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# ─── Persistence: AOF (Append-Only File) ──────────────────────
# AOF is critical for durability of rate-limit and session state
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# ─── RDB Snapshots (additional backup layer) ──────────────────
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ─── Logging ──────────────────────────────────────────────────
loglevel notice
logfile ""

# ─── Slow Log Monitoring ──────────────────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 256

# ─── Security: Disable Dangerous Commands ─────────────────────
rename-command FLUSHALL ""
rename-command FLUSHDB  ""
rename-command DEBUG    ""
rename-command CONFIG   "REDIS_CONFIG_9x8f7z"
# rename-command KEYS     "REDIS_KEYS_9x8f7z"
rename-command SHUTDOWN "REDIS_SHUTDOWN_9x8f7z"

# ─── Connection Limits ────────────────────────────────────────
maxclients 1000
tcp-backlog 511
tcp-keepalive 300
timeout 300

# ─── I/O Threads (for better performance on multi-core) ───────
io-threads 2
io-threads-do-reads yes

# ─── Lazy Freeing (non-blocking memory reclaim) ───────────────
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
