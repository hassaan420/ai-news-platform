# docker-compose.prod.yml — Production Hardened Overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Applies: CIS Docker Benchmark, no-new-privileges, cap_drop, read_only, SSL JDBC

services:

  # ─── Infrastructure ──────────────────────────────────────────

  mysql:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M

  redis:
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M

  # ─── Application Services ───────────────────────────────────

  gateway-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp/app:size=64M,mode=1777
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M

  auth-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # SECURITY FIX: Enable SSL on JDBC connections
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/auth_db?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&sslMode=PREFERRED"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp/app:size=64M,mode=1777
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M

  news-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/news_db?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&sslMode=PREFERRED"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp/app:size=128M,mode=1777
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.5"
        reservations:
          memory: 384M

  category-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/category_db?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&sslMode=PREFERRED"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp/app:size=64M,mode=1777
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M

  search-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp/app:size=64M,mode=1777
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M

  scheduler-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/news_db?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&sslMode=PREFERRED"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp/app:size=64M,mode=1777
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M

  admin-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/admin_db?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&sslMode=PREFERRED"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp/app:size=64M,mode=1777
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M

  frontend:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64M
      - /var/run:size=8M
      - /tmp:size=32M
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
        reservations:
          memory: 64M

  # ─── Nginx ───────────────────────────────────────────────────

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64M
      - /var/run:size=8M
      - /tmp:size=32M
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
        reservations:
          memory: 64M
