apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-news-service
  namespace: ai-news
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - ai-news
    labelSelectors:
      "app": "news-service"
  delay:
    latency: "200ms"
    correlation: "100"
    jitter: "0ms"
  duration: "30s"
  scheduler:
    cron: "@every 2m"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-kill-redis
  namespace: ai-news
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - ai-news
    labelSelectors:
      "app.kubernetes.io/name": "redis"
  duration: "10s"
  scheduler:
    cron: "@every 5m"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress-gateway
  namespace: ai-news
spec:
  mode: all
  selector:
    namespaces:
      - ai-news
    labelSelectors:
      "app": "gateway-service"
  stressors:
    cpu:
      workers: 2
      load: 100
  duration: "30s"
  scheduler:
    cron: "@every 5m"
