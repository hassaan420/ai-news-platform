apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-news-ingress
  namespace: ai-news
  annotations:
    # ALB / Nginx Ingress Controller Annotations
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # Cert-Manager for Let's Encrypt TLS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # ExternalDNS for automatic Route 53 configuration
    external-dns.alpha.kubernetes.io/hostname: "api.ainewsplatform.com, www.ainewsplatform.com"
spec:
  tls:
  - hosts:
    - api.ainewsplatform.com
    - www.ainewsplatform.com
    secretName: ai-news-tls-secret
  rules:
  - host: api.ainewsplatform.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: gateway-service
            port:
              number: 8080
  - host: www.ainewsplatform.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
