# docker-compose.override.yml — local development overrides
# Automatically loaded by `docker compose up` when present.
# See DOCKER.md §7
#
# Overrides applied:
#   - Exposed ports on all services for direct debugging
#   - SPRING_PROFILES_ACTIVE=dev on all services
#   - JAVA_OPTS with smaller heap for local dev

services:

  # ─── Expose infrastructure ports in dev mode ───────────────

  mysql:
    ports:
      - "3306:3306"

  redis:
    ports:
      - "6379:6379"

  # ─── Expose all service ports for local debugging ──────────

  gateway-service:
    ports:
      - "8080:8080"
    volumes:
      - ./gateway-service/src/main/resources/application.yml:/app/config/application.yml:ro
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_OPTS: "-Xmx96m -Xms48m -Xss256k -XX:MaxMetaspaceSize=96m -XX:+UseContainerSupport"

  auth-service:
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_OPTS: "-Xmx96m -Xms48m -Xss256k -XX:MaxMetaspaceSize=96m -XX:+UseContainerSupport"

  news-service:
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_OPTS: "-Xmx192m -Xms96m -Xss256k -XX:MaxMetaspaceSize=128m -XX:+UseContainerSupport"
      AI_PROCESSING_WORKER_COUNT: 1

  category-service:
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_OPTS: "-Xmx96m -Xms48m -Xss256k -XX:MaxMetaspaceSize=96m -XX:+UseContainerSupport"
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY}

  search-service:
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_OPTS: "-Xmx96m -Xms48m -Xss256k -XX:MaxMetaspaceSize=96m -XX:+UseContainerSupport"

  scheduler-service:
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_OPTS: "-Xmx96m -Xms48m -Xss256k -XX:MaxMetaspaceSize=96m -XX:+UseContainerSupport"
      SCHEDULER_ENABLED: true

  admin-service:
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_OPTS: "-Xmx96m -Xms48m -Xss256k -XX:MaxMetaspaceSize=96m -XX:+UseContainerSupport"
