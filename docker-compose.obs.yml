version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: news-platform-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - news-platform-net
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:latest
    container_name: news-platform-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - news-platform-net

  grafana:
    image: grafana/grafana:latest
    container_name: news-platform-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - news-platform-net
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:main
    container_name: news-platform-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - news-platform-net

  promtail:
    image: grafana/promtail:main
    container_name: news-platform-promtail
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./docker/promtail/promtail.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - news-platform-net
    depends_on:
      - loki

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: news-platform-zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    networks:
      - news-platform-net

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:

networks:
  news-platform-net:
    external: false
