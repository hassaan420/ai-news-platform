name: Enterprise CI — Build, Scan, and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ─── Job 1: OWASP Dependency Check ───────────────────────────
  dependency-scan:
    name: OWASP Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run OWASP Dependency-Check
        run: |
          ./apache-maven-3.9.6/bin/mvn -B org.owasp:dependency-check-maven:check \
            --no-transfer-progress \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFiles=owasp-suppressions.xml
        continue-on-error: false

      - name: Upload OWASP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-report
          path: '**/target/dependency-check-report.html'

  # ─── Job 2: Build, Container Scan, Push (matrix per service) ─
  build-scan-push:
    name: Build & Scan — ${{ matrix.service }}
    needs: dependency-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            port: 8081
          - service: gateway-service
            port: 8080
          - service: news-service
            port: 8082
          - service: category-service
            port: 8083
          - service: search-service
            port: 8084
          - service: scheduler-service
            port: 8085
          - service: admin-service
            port: 8086
          - service: frontend
            port: 80

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local load for scanning)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          load: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:scan-target
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Generate SBOM (Software Bill of Materials)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:scan-target
          artifact-name: sbom-${{ matrix.service }}.spdx.json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Trivy — Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:scan-target
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Push hardened image (only after scan passes)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ─── Job 3: Deploy to EKS (Blue/Green via Argo Rollouts) ──────
  deploy:
    name: Deploy to Production (EKS)
    needs: build-scan-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name ai-news-cluster --region us-east-1

      - name: Set image tags in Kustomize
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          for service in auth-service gateway-service news-service category-service search-service scheduler-service admin-service frontend; do
            kubectl set image deployment/${service} ${service}=${{ env.IMAGE_PREFIX }}/${service}:${SHA_TAG} -n ai-news
          done

      - name: Wait for rollout
        run: |
          for service in auth-service gateway-service news-service category-service search-service scheduler-service admin-service frontend; do
            kubectl rollout status deployment/${service} -n ai-news --timeout=5m
          done

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Rollout failed — initiating rollback..."
          for service in auth-service gateway-service news-service category-service search-service scheduler-service admin-service frontend; do
            kubectl rollout undo deployment/${service} -n ai-news || true
          done
